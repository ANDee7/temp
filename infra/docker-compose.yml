version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: dikidi_clone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dikidi_clone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dikidi_clone_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: dikidi_clone_mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
